protocol:
  version: pbcwm-protocol-v1

  schedule:
    template: [P0, A, B, C, B, A]
    randomize_abc_per_seed: true
    stage_jitter_fraction: 0.10
    bootstrap_stage_jitter: false
    lifetime_clock: global_env_step
    change_mid_episode: true

  stage_length:
    Pendulum-v1: 10000
    Hopper-v5: 50000
    HalfCheetah-v5: 50000
    Ant-v5: 75000

  warmup_steps:
    Pendulum-v1: 2000
    Hopper-v5: 5000
    HalfCheetah-v5: 5000
    Ant-v5: 10000

  preference:
    total_budget: 200
    bootstrap_queries: 40
    bootstrap_rounds: 4
    online_queries: 160
    online_rounds: 16
    queries_per_round: 10
    query_jitter_fraction: 0.20
    minimum_spacing_fraction: 0.50

  reward_model:
    ensemble_size: 3
    batch_size: 64
    updates_per_query_round: 100

  world_model:
    min_buffer_before_update: 256
    update_opportunities_per_env_step: 1
    default_neural_batch_size: 256

  planner:
    type: cem
    replan_interval: 1
    iterations: 3
    elite_fraction: 0.10
    by_env:
      Pendulum-v1: {horizon: 25, population: 256}
      Hopper-v5: {horizon: 20, population: 256}
      HalfCheetah-v5: {horizon: 20, population: 256}
      Ant-v5: {horizon: 20, population: 256}

  evaluation:
    stage_fractions: [0.00, 0.02, 0.05, 0.10, 0.20, 0.40, 0.60, 0.80, 1.00]
    recurrence_interactions: [16, 32, 64, 128]
    planning_episodes_regular: 5
    planning_episodes_stage_end: 10

  seeds:
    development: [0, 1, 2]
    final: [100, 101, 102, 103, 104, 105, 106, 107, 108, 109]

  tuning:
    max_configs_per_method_env: 8
    development_seeds: [0, 1, 2]
