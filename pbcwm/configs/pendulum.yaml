seed: 0
device: auto

env:
  name: Pendulum-v1
  dynamics_schedule:
    - step: 0
      mass: 1.0
      length: 1.0
      gravity: 10.0
    - step: 1000
      mass: 1.5
      length: 1.0
      gravity: 10.0

training:
  total_steps: 2000
  random_steps: 100
  learning_starts: 50
  updates_per_step: 1
  batch_size: 64
  replay_capacity: 100000
  evaluation_capacity: 128
  evaluation_fraction: 0.2
  log_interval: 100
  log_path: outputs/pendulum_smoke.jsonl

model:
  hidden_dims: [128, 128]
  learning_rate: 0.001

planner:
  horizon: 15
  population_size: 128
  elite_size: 16
  num_iterations: 3
  initial_std: 1.0
  discount: 1.0
