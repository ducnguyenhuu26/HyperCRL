seed: 0
device: auto

env:
  name: Pendulum-v1
  dynamics_schedule:
    - step: 0
      mass: 1.0
      length: 1.0
      gravity: 10.0
    - step: 200
      mass: 1.5
      length: 1.0
      gravity: 10.0

training:
  total_steps: 400
  dynamics_random_steps: 40
  dynamics_learning_starts: 8
  dynamics_updates_per_step: 1
  dynamics_batch_size: 8
  log_interval: 50
  log_path: outputs/pendulum_gpmm.jsonl
  heldout_preference_examples: 8

baseline:
  name: gpmm

model:
  hidden_dims: [64, 64]
  learning_rate: 0.003

planner:
  horizon: 8
  population_size: 64
  elite_size: 8
  num_iterations: 2
  initial_std: 1.0

preference:
  ensemble_size: 3
  hidden_dims: [64, 64]
  learning_rate: 0.003
  reward_batch_size: 8
  bootstrap_queries: 16
  bootstrap_horizon: 8
  min_preferences_before_planning: 12
  query_interval_steps: 100
  queries_per_round: 4
  pair_pool_size: 64
  reward_updates_per_round: 10
  candidate_keep_per_iteration: 6
  candidate_keep_final_elites: 6
  teacher_skip_margin: 0.0

gpmm:
  alpha: 1.0
  sticky_bonus: 10.0
  transition_base_count: 1.0
  expert_min_points_before_competition: 5
  gp_fit_steps: 3
  gp_learning_rate: 0.05
  max_points_per_expert: 32
  merge_enabled: true
  merge_burnin_points: 20
  merge_threshold: 0.5
  prune_probationary: true
  min_predictive_variance: 1.0e-5
  max_predictive_variance: 1.0e3
  prior_variance: 1.0
  observation_noise: 0.05
